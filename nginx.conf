events {
    worker_connections 1024;
}

http {
    server {
        listen 80;
        server_name localhost;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location = /assistant.js {
            alias /usr/share/nginx/html/assistant.js;
            default_type application/javascript;
            add_header Cache-Control 'no-store' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location = /runtime-patch-v6.4.js {
            alias /usr/share/nginx/html/runtime-patch-v6.4.js;
            default_type application/javascript;
            add_header Cache-Control 'no-store' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location = /runtime-hotfix-v6.4-content-loop.js {
            alias /usr/share/nginx/html/runtime-hotfix-v6.4-content-loop.js;
            default_type application/javascript;
            add_header Cache-Control 'no-store' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location = /runtime-context-v6.4.js {
            alias /usr/share/nginx/html/runtime-context-v6.4.js;
            default_type application/javascript;
            add_header Cache-Control 'no-store' always;
            add_header 'Access-Control-Allow-Origin' '*' always;
        }

        location / {
            proxy_pass http://ai-proxy:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 35s;
            proxy_send_timeout 35s;
            proxy_read_timeout 35s;
        }
    }
}
