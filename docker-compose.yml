services:
  ollama:
    image: ollama/ollama:latest
    container_name: global-exam-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_ORIGINS: "*"
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull-qwen3:
    image: ollama/ollama:latest
    container_name: global-exam-ollama-pull-qwen3
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: "http://ollama:11434"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sleep 5 &&
      ollama pull qwen3:4b"
    restart: "no"

volumes:
  ollama-data:
