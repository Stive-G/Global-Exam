services:
  ai-proxy:
    image: node:22-alpine
    container_name: global-exam-ai-proxy
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      PORT: "3001"
    volumes:
      - type: bind
        source: ./multi-ai-proxy.mjs
        target: /app/multi-ai-proxy.mjs
        read_only: true
    command: ["node", "/app/multi-ai-proxy.mjs"]

  cors-proxy:
    image: nginx:alpine
    container_name: global-exam-proxy
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - ai-proxy
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
      - type: bind
        source: ./global-exam-assistant-v6.3.js
        target: /usr/share/nginx/html/assistant.js
        read_only: true
      - type: bind
        source: ./runtime-patch-v6.4.js
        target: /usr/share/nginx/html/runtime-patch-v6.4.js
        read_only: true
      - type: bind
        source: ./runtime-hotfix-v6.4-content-loop.js
        target: /usr/share/nginx/html/runtime-hotfix-v6.4-content-loop.js
        read_only: true
      - type: bind
        source: ./runtime-context-v6.4.js
        target: /usr/share/nginx/html/runtime-context-v6.4.js
        read_only: true
      - type: bind
        source: ./runtime-page-audit-v6.4.js
        target: /usr/share/nginx/html/runtime-page-audit-v6.4.js
        read_only: true
